  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    html, body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      color: #ffffff;
      padding: 16px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(168, 85, 247, 0.20), transparent 35%),
        radial-gradient(circle at top right, rgba(59, 130, 246, 0.14), transparent 30%),
        radial-gradient(circle at bottom center, rgba(236, 72, 153, 0.10), transparent 28%),
        linear-gradient(135deg, #060608 0%, #0b0b12 40%, #11111b 100%);
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 34px 34px;
    }

    header {
      margin-bottom: 20px;
      position: sticky;
      top: 10px;
      z-index: 100;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(22, 22, 30, 0.92);
      backdrop-filter: blur(10px);
      padding: 12px 20px;
      border-radius: 16px;
      border: 1px solid #232332;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .logo span {
      color: #a855f7;
    }

    .search-box input {
      padding: 9px 16px;
      border-radius: 12px;
      border: 1px solid #2d2d3f;
      background: #0d0d11;
      color: #ffffff;
      outline: none;
      width: 240px;
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-box input:focus {
      border-color: #a855f7;
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.14);
    }

    .categories {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 8px 16px;
      border: 1px solid #232332;
      background: rgba(22, 22, 30, 0.95);
      color: #a0a0b8;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: #a855f7;
      color: #ffffff;
      border-color: #a855f7;
      box-shadow: 0 8px 18px rgba(168, 85, 247, 0.25);
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #f1f1f5;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 14px;
      margin-bottom: 30px;
    }

    .game-card {
      background: rgba(22, 22, 30, 0.96);
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid #232332;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: #a855f7;
      box-shadow: 0 8px 20px rgba(168, 85, 247, 0.22);
    }

    .thumb-wrapper {
      position: relative;
      width: 100%;
      height: 110px;
      background: #1a1a24;
      overflow: hidden;
    }

    .thumb-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
      display: block;
    }

    .game-card:hover .thumb-wrapper img {
      transform: scale(1.05);
    }

    .card-info {
      padding: 10px;
      text-align: left;
    }

    .card-info h3 {
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .card-info .category-tag {
      font-size: 10px;
      font-weight: 700;
      color: #a855f7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #playerModal {
      display: none;
      position: fixed;
      inset: 0;
      background-color: rgba(5, 5, 8, 0.96);
      z-index: 100000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-bar {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
    }

    .game-title-display {
      font-size: 16px;
      font-weight: 700;
      color: #a855f7;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-close {
      background: #ef4444;
      color: #ffffff;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      flex: 0 0 auto;
    }

    #gameIframe {
      width: 100%;
      max-width: 1100px;
      height: 80vh;
      min-height: 420px;
      border: none;
      border-radius: 14px;
      background: #000;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }

    #floatingBall {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle at 30% 25%, #f0abfc 0%, #c084fc 22%, #7e22ce 70%, #4c1d95 100%);
      border-radius: 50%;
      position: fixed;
      bottom: 30px;
      right: 20px;
      z-index: 9999;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.65), inset -8px -10px 15px rgba(0,0,0,0.25), inset 5px 5px 12px rgba(255,255,255,0.28);
      border: 2px solid rgba(255,255,255,0.25);
      cursor: grab;
      touch-action: none;
    }

    .ad-box {
      margin: 18px 0;
      padding: 14px;
      border: 1px dashed rgba(168, 85, 247, 0.4);
      border-radius: 14px;
      background: rgba(22, 22, 30, 0.55);
      color: #bdbdd1;
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      body { padding: 12px; }
      .header-container { flex-direction: column; align-items: stretch; }
      .search-box input { width: 100%; }
      .games-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      #gameIframe { height: 76vh; min-height: 360px; border-radius: 10px; }
      .logo { text-align: center; }
      .modal-bar { flex-direction: column; align-items: stretch; }
      .btn-close { width: 100%; }
    }
  </style>
</head>
<body>

  <div id="floatingBall"></div>

  <div id="playerModal">
    <div class="modal-bar">
      <span class="game-title-display" id="activeGameTitle">Playing Game</span>
      <button class="btn-close" onclick="closeGamePlayer()">✕ CLOSE</button>
    </div>
    <iframe
      id="gameIframe"
      src=""
      allowfullscreen
      allow="autoplay; payment; fullscreen; microphone; clipboard-read; clipboard-write; accelerometer; gyroscope; gamepad">
    </iframe>
  </div>

  <header>
    <div class="header-container">
      <div class="logo">Game<span>Outway</span></div>
      <div class="search-box">
        <input type="text" id="searchInput" onkeyup="searchGame()" placeholder="Search games...">
      </div>
    </div>
  </header>

  <div class="categories">
    <button class="cat-btn active" onclick="filterCategory('all', this)">All Games</button>
    <button class="cat-btn" onclick="filterCategory('trending', this)">🔥 Popular</button>
    <button class="cat-btn" onclick="filterCategory('racing', this)">🏎️ Racing</button>
    <button class="cat-btn" onclick="filterCategory('action', this)">💣 Action</button>
    <button class="cat-btn" onclick="filterCategory('puzzle', this)">🧩 Puzzle</button>
    <button class="cat-btn" onclick="filterCategory('sports', this)">🏏 Sports</button>
  </div>

  <div class="ad-box">Ad space preserved here</div>

  <main>
    <div class="section-title">Featured Games</div>
    <div class="games-grid" id="gamesGrid"></div>
  </main>

  <script>
    const SITE_URL = encodeURIComponent("https://yourdomain.com/");
    const modal = document.getElementById("playerModal");
    const iframe = document.getElementById("gameIframe");
    const titleDisplay = document.getElementById("activeGameTitle");
    const grid = document.getElementById("gamesGrid");

    const games = [
      { title: "Moto X3M", category: "racing", url: "https://html5.gamedistribution.com/152c96c42ddf4b8aba5ebdd0a6711585/", img: "https://images.gamedistribution.com/152c96c42ddf4b8aba5ebdd0a6711585-512x512.jpeg" },
      { title: "Retro Bowl", category: "sports", url: "https://game316.github.io/retro-bowl/", img: "https://tse1.mm.bing.net/th?q=Retro+Bowl+game+icon&w=300&h=300&c=7&rs=1" },
      { title: "Drift Boss", category: "racing", url: "https://html5.gamedistribution.com/0a8b51e5eaee42e7b4db83ca00afc92e/", img: "https://images.gamedistribution.com/0a8b51e5eaee42e7b4db83ca00afc92e-512x512.jpeg" },
      { title: "Super Tank War", category: "action", url: "https://html5.gamedistribution.com/669cdcf4e7234edfa21bfa66fa19b8df/", img: "https://images.gamedistribution.com/669cdcf4e7234edfa21bfa66fa19b8df-512x512.jpeg" },
      { title: "Stickman Parkour", category: "action", url: "https://html5.gamedistribution.com/4c868d4f4bfb44b8a4f47ec0537be8cd/", img: "https://images.gamedistribution.com/4c868d4f4bfb44b8a4f47ec0537be8cd-512x512.jpeg" },
      { title: "2048 Puzzle", category: "puzzle", url: "https://html5.gamedistribution.com/e4834283bce2457980b6cb1da52c1430/", img: "https://images.gamedistribution.com/e4834283bce2457980b6cb1da52c1430-512x512.jpeg" },
      { title: "8 Ball Billiards", category: "sports", url: "https://html5.gamedistribution.com/167b223d6a2f4ab6a02b66236b328a6f/", img: "https://images.gamedistribution.com/167b223d6a2f4ab6a02b66236b328a6f-512x512.jpeg" },
      { title: "Zombie Survival", category: "action", url: "https://html5.gamedistribution.com/568bb9e623ec42e3a89a0f5a7a9cb2dd/", img: "https://images.gamedistribution.com/568bb9e623ec42e3a89a0f5a7a9cb2dd-512x512.jpeg" },
      { title: "Bubble Shooter", category: "puzzle", url: "https://html5.gamedistribution.com/21cd459a9ad94c25864cada0bc85d840/", img: "https://images.gamedistribution.com/21cd459a9ad94c25864cada0bc85d840-512x512.jpeg" },
      { title: "Traffic Racer 3D", category: "racing", url: "https://html5.gamedistribution.com/6bd118a8037340d0a51c4a0346337f76/", img: "https://images.gamedistribution.com/6bd118a8037340d0a51c4a0346337f76-512x512.jpeg" },
      { title: "Tic Tac Toe", category: "puzzle", url: "https://html5.gamedistribution.com/ea4ef6e9126646c5877bc6ad9d63d626/", img: "https://images.gamedistribution.com/ea4ef6e9126646c5877bc6ad9d63d626-512x512.jpeg" },
      { title: "Master Chess", category: "sports", url: "https://html5.gamedistribution.com/f97b69324e75424cb91244e82df42323/", img: "https://images.gamedistribution.com/f97b69324e75424cb91244e82df42323-512x512.jpeg" }
    ];

    function buildEmbedUrl(url) {
      const separator = url.includes("?") ? "&" : "?";
      return url + separator + "gd_sdk_referrer_url=" + SITE_URL;
    }

    function renderGames(list) {
      grid.innerHTML = "";
      list.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.dataset.cat = game.category;

        card.innerHTML = `
          <div class="thumb-wrapper">
            <img src="${game.img}" alt="${game.title}" loading="lazy" onerror="this.src='https://placehold.co/512x512/16161e/a855f7?text=${encodeURIComponent(game.title)}'">
          </div>
          <div class="card-info">
            <h3>${game.title}</h3>
            <span class="category-tag">${game.category}</span>
          </div>
        `;

        card.addEventListener("click", () => loadGame(game.url, game.title));
        grid.appendChild(card);
      });
    }

    function loadGame(url, title) {
      titleDisplay.textContent = title;
      iframe.src = buildEmbedUrl(url);
      modal.style.display = "flex";
      document.body.style.overflow = "hidden";
    }

    function closeGamePlayer() {
      iframe.src = "about:blank";
      modal.style.display = "none";
      document.body.style.overflow = "";
    }

    function filterCategory(cat, selectedButton) {
      document.querySelectorAll(".cat-btn").forEach(button => button.classList.remove("active"));
      selectedButton.classList.add("active");

      const filtered = cat === "all" ? games : games.filter(game => game.category === cat);
      renderGames(filtered);
      searchInput.value = "";
    }

    function searchGame() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const filtered = games.filter(game => game.title.toLowerCase().includes(input));
      renderGames(filtered);
    }

    document.addEventListener("keydown", function(event) {
      if (event.key === "Escape") closeGamePlayer();
    });

    const ball = document.getElementById("floatingBall");
    let posX = window.innerWidth - 90, posY = window.innerHeight - 100;
    let vx = 0, vy = 0, gravity = 0.5, bounce = 0.7;
    let isDragging = false, lastX = 0, lastY = 0;

    function animateBall() {
      if (!isDragging) {
        vy += gravity;
        posX += vx;
        posY += vy;

        if (posY + 70 > window.innerHeight) { posY = window.innerHeight - 70; vy *= -bounce; vx *= 0.95; }
        if (posY < 0) { posY = 0; vy *= -bounce; }
        if (posX + 70 > window.innerWidth) { posX = window.innerWidth - 70; vx *= -bounce; }
        if (posX < 0) { posX = 0; vx *= -bounce; }

        ball.style.left = posX + "px";
        ball.style.top = posY + "px";
      }
      requestAnimationFrame(animateBall);
    }

    function startTouch(e) {
      isDragging = true;
      lastX = e.touches ? e.touches[0].clientX : e.clientX;
      lastY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = 0;
      vy = 0;
    }

    function moveTouch(e) {
      if (!isDragging) return;
      e.preventDefault();
      const curX = e.touches ? e.touches[0].clientX : e.clientX;
      const curY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = curX - lastX;
      vy = curY - lastY;
      posX = curX - 35;
      posY = curY - 35;
      ball.style.left = posX + "px";
      ball.style.top = posY + "px";
      lastX = curX;
      lastY = curY;
    }

    function endTouch() { isDragging = false; }

    ball.addEventListener("mousedown", startTouch);
    window.addEventListener("mousemove", moveTouch, { passive: false });
    window.addEventListener("mouseup", endTouch);
    ball.addEventListener("touchstart", startTouch, { passive: false });
    window.addEventListener("touchmove", moveTouch, { passive: false });
    window.addEventListener("touchend", endTouch);

    renderGames(games);
    animateBall();
  </script>
