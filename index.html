<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Outway - Free Online Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header-container">
            <div class="logo">🎮 <span>Game Outway</span></div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="🔍 Search games...">
            </div>
        </div>

        <!-- Category Filter Buttons -->
        <div class="category-bar">
            <button class="cat-btn active" onclick="filterCategory('all')">🔥 All Games</button>
            <button class="cat-btn" onclick="filterCategory('racing')">🏎️ Racing</button>
            <button class="cat-btn" onclick="filterCategory('puzzle')">🧩 Puzzle</button>
            <button class="cat-btn" onclick="filterCategory('action')">🎯 Action</button>
            <button class="cat-btn" onclick="filterCategory('arcade')">🕹️ Arcade</button>
        </div>
    </header>

    <!-- Main Game Section (Full Screen Grid) -->
    <main class="main-layout">
        <h2 class="section-title">⚡ Featured Games</h2>
        
        <div class="game-grid" id="gameGrid">
            
            <!-- Game 1: Moto X3M -->
            <div class="game-card" data-category="racing" onclick="playGame('https://maddoxpr.github.gq/moto-x3m/', 'Moto X3M Bike Race')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400&q=80" alt="Moto X3M">
                </div>
                <div class="card-info">
                    <h3>Moto X3M Bike</h3>
                    <span class="tag racing">Racing</span>
                </div>
            </div>

            <!-- Game 2: Tic Tac Toe -->
            <div class="game-card" data-category="puzzle" onclick="playGame('https://playtictactoe.org/', 'Tic Tac Toe Master')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1611996575749-79a3a250f948?w=400&q=80" alt="Tic Tac Toe">
                </div>
                <div class="card-info">
                    <h3>Tic Tac Toe</h3>
                    <span class="tag puzzle">Puzzle</span>
                </div>
            </div>

            <!-- Game 3: 2048 Game -->
            <div class="game-card" data-category="puzzle" onclick="playGame('https://play2048.co/', '2048 Classic')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80" alt="2048">
                </div>
                <div class="card-info">
                    <h3>2048 Classic</h3>
                    <span class="tag puzzle">Puzzle</span>
                </div>
            </div>

            <!-- Game 4: Drift Boss -->
            <div class="game-card" data-category="racing" onclick="playGame('https://html5.gamemonetize.co/8k4c62v83p0g1g3j7l94w6136m86b978/', 'Drift Boss')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1568605117036-5fe5e7bab0b7?w=400&q=80" alt="Drift Boss">
                </div>
                <div class="card-info">
                    <h3>Drift Boss</h3>
                    <span class="tag racing">Racing</span>
                </div>
            </div>

            <!-- Game 5: Pacman Arcade -->
            <div class="game-card" data-category="arcade" onclick="playGame('https://freepacman.org/', 'Classic Pacman')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=400&q=80" alt="Pacman">
                </div>
                <div class="card-info">
                    <h3>Classic Pacman</h3>
                    <span class="tag arcade">Arcade</span>
                </div>
            </div>

            <!-- Game 6: Flappy Bird -->
            <div class="game-card" data-category="arcade" onclick="playGame('https://flappybird.io/', 'Flappy Bird')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=400&q=80" alt="Flappy Bird">
                </div>
                <div class="card-info">
                    <h3>Flappy Bird</h3>
                    <span class="tag arcade">Arcade</span>
                </div>
            </div>

            <!-- Game 7: Tower Building -->
            <div class="game-card" data-category="action" onclick="playGame('https://html5.gamemonetize.co/3a5u18e11n0i6b4m2o7w9532l175a867/', 'Tower Builder')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=400&q=80" alt="Tower Builder">
                </div>
                <div class="card-info">
                    <h3>Tower Builder</h3>
                    <span class="tag action">Action</span>
                </div>
            </div>

            <!-- Game 8: Retro Snake -->
            <div class="game-card" data-category="arcade" onclick="playGame('https://playsnake.org/', 'Classic Snake Game')">
                <div class="thumb-box">
                    <img src="https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=400&q=80" alt="Snake">
                </div>
                <div class="card-info">
                    <h3>Classic Snake</h3>
                    <span class="tag arcade">Arcade</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Game Player Modal Popup -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalGameTitle">Playing Game</h2>
                <button class="close-btn" onclick="closeGame()">❌ Close Game</button>
            </div>
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>Game Outway</strong>. All Rights Reserved.</p>
    </footer>

    <!-- Interactive Script -->
    <script>
        function playGame(gameUrl, title) {
            document.getElementById('modalGameTitle').innerText = title;
            document.getElementById('gameFrame').src = gameUrl;
            document.getElementById('gameModal').style.display = "flex";
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = "none";
            document.getElementById('gameFrame').src = "";
        }

        function searchGames() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "flex" : "none";
            }
        }

        function filterCategory(category) {
            let cards = document.getElementsByClassName('game-card');
            let buttons = document.getElementsByClassName('cat-btn');

            for (let btn of buttons) btn.classList.remove('active');
            event.target.classList.add('active');

            for (let card of cards) {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
