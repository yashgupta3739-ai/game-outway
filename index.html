      { id: 20, name: "Devil", emoji: "😈", adsWatched: 0, unlocked: false, unlockTime: null }
    ];

    let storeItems = JSON.parse(localStorage.getItem('gameOutwayStore')) || defaultStoreItems;
    let currentEquipped = parseInt(localStorage.getItem('gameOutwayEquipped')) || 1;

    // 🕒 24-HOUR EXPIRATION CHECKER
    function checkExpirations() {
      const now = new Date().getTime();
      let dataChanged = false;
      const hours24 = 24 * 60 * 60 * 1000;

      storeItems.forEach(item => {
        if (item.id !== 1 && item.unlocked && item.unlockTime) {
          const timePassed = now - item.unlockTime;
          if (timePassed >= hours24) {
            item.unlocked = false;
            item.adsWatched = 0;
            item.unlockTime = null;
            dataChanged = true;
            if (currentEquipped === item.id) {
              currentEquipped = 1;
            }
          }
        }
      });
      if (dataChanged) saveData();
    }

    function saveData() {
      localStorage.setItem('gameOutwayStore', JSON.stringify(storeItems));
      localStorage.setItem('gameOutwayEquipped', currentEquipped.toString());
    }

    function renderStore() {
      checkExpirations();
      const grid = document.getElementById('storeGrid');
      grid.innerHTML = '';
      
      storeItems.forEach(item => {
        const progressPercent = (item.adsWatched / 2) * 100;
        let btnHTML = '';
        let timerHTML = '';
        
        if (item.unlocked) {
          if(item.id !== 1 && item.unlockTime) {
            const timeLeft = (24 * 60 * 60 * 1000) - (new Date().getTime() - item.unlockTime);
            const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
            timerHTML = `<div style="font-size:10px; color:#aaa; margin-bottom:5px;">Locks in ${hoursLeft}h</div>`;
          }

          if (currentEquipped === item.id) {
            btnHTML = `<button class="action-btn btn-equipped">Equipped</button>`;
          } else {
            btnHTML = `<button class="action-btn btn-equip" onclick="equipSkin(${item.id})">Equip</button>`;
          }
        } else {
          btnHTML = `<button class="action-btn btn-watch" onclick="watchAdToUnlock(${item.id})">🎥 Watch Ad (${item.adsWatched}/2)</button>`;
        }

        grid.innerHTML += `
          <div class="skin-card">
            <div class="skin-icon">${item.emoji}</div>
            <h3>${item.name}</h3>
            ${timerHTML}
            <div class="progress-bar"><div class="progress-fill" style="width: ${progressPercent}%;"></div></div>
            ${btnHTML}
          </div>
        `;
      });
      applyCurrentSkin();
    }

    function watchAdToUnlock(id) {
      window.open('https://pl30634564.effectivecpmnetwork.com/75/79/42/757942df229ca98d773c9bb85051c183.js', '_blank');
      
      setTimeout(() => {
        const item = storeItems.find(i => i.id === id);
        if (item.adsWatched < 2) {
          item.adsWatched++;
          if (item.adsWatched === 2) {
            item.unlocked = true;
            item.unlockTime = new Date().getTime();
            alert(`🎉 Congratulations! ${item.name} skin unlocked for 24 Hours!`);
          }
          saveData();
          renderStore();
        }
      }, 2000);

      currentEquipped = id;
      saveData();
      renderStore();
    }

      const item = storeItems.find(i => i.id === currentEquipped) || storeItems[0];

      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));

      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        if (cat === 'all' || card.getAttribute('data-cat') === cat) card.style.display = 'flex';
        else card.style.display = 'none';
      });
    }

      const input = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.game-card').forEach(card => {
        const title = card.querySelector('h3').innerText.toLowerCase();
        card.style.display = title.includes(input) ? 'flex' : 'none';
      });

    // 🔮 FLOATING DRAG/PHYSICS BALL
    const ballElement = document.getElementById('floatingBall');
    let posX = window.innerWidth - 90, posY = window.innerHeight - 100;
    let vx = 0, vy = 0, gravity = 0.5, bounce = 0.7;
    let isDragging = false, lastX = 0, lastY = 0;

    function animateBall() {
      if (!isDragging) {
        vy += gravity; posX += vx; posY += vy;
        if (posY + 65 > window.innerHeight) { posY = window.innerHeight - 65; vy *= -bounce; vx *= 0.95; }
        if (posY < 0) { posY = 0; vy *= -bounce; }
        if (posX + 65 > window.innerWidth) { posX = window.innerWidth - 65; vx *= -bounce; }
        if (posX < 0) { posX = 0; vx *= -bounce; }
        ballElement.style.left = posX + 'px'; ballElement.style.top = posY + 'px';
      }
      requestAnimationFrame(animateBall);
    }

    function startTouch(e) {
      isDragging = true;
      lastX = e.touches ? e.touches[0].clientX : e.clientX;
      lastY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = 0; vy = 0;
    }

    function moveTouch(e) {
      if (!isDragging) return;
      e.preventDefault();
      const curX = e.touches ? e.touches[0].clientX : e.clientX;
      const curY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = curX - lastX; vy = curY - lastY;
      posX = curX - 32; posY = curY - 32; 
      ballElement.style.left = posX + 'px'; ballElement.style.top = posY + 'px';
      lastX = curX; lastY = curY;
    }

    function endTouch() { isDragging = false; }

    ballElement.addEventListener('mousedown', startTouch);
    window.addEventListener('mousemove', moveTouch, { passive: false });
    window.addEventListener('mouseup', endTouch);
    ballElement.addEventListener('touchstart', startTouch, { passive: false });
    window.addEventListener('touchmove', moveTouch, { passive: false });
    window.addEventListener('touchend', endTouch);
    
    window.onload = () => {
      checkExpirations();
      applyCurrentSkin();
      generate1000Games();
      animateBall();
    };
