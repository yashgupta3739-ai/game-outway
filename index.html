        function renderGames(category = 'all', searchQuery = '') {

                  <div class="game-icon-box" style="display:none;">${game.icon}</div>

        function playFlashlightMaze() {
            let player = { x: 40, y: 40, size: 15 };
            let exit = { x: 430, y: 430, size: 35 };

            function loop() {
                ctx.fillStyle = '#050505';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                player.x += (mouse.x - player.x) * 0.08;
                player.y += (mouse.y - player.y) * 0.08;
                let grad = ctx.createRadialGradient(player.x, player.y, 5, player.x, player.y, 110);
                grad.addColorStop(0, 'rgba(255,255,255,0.95)');
                grad.addColorStop(0.4, 'rgba(168,85,247,0.35)');
                grad.addColorStop(1, 'rgba(0,0,0,0.98)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(player.x, player.y, 110, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#22c55e';
                ctx.fillRect(exit.x, exit.y, exit.size, exit.size);
                ctx.fillStyle = '#a855f7';
                ctx.beginPath();
                ctx.arc(player.x, player.y, player.size, 0, Math.PI * 2);
                ctx.fill();
                currentGameLoop = requestAnimationFrame(loop);
            }
            loop();
        }

        function playGlowChain() {
            let particles = [];
            for (let i = 0; i < 40; i++) {
                particles.push({ x: Math.random() * 500, y: Math.random() * 500, vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2, r: Math.random() * 6 + 3, color: `hsl(${Math.random()*360},80%,60%)` });
            }

            function loop() {
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > 500) p.vx *= -1;
                    if (p.y < 0 || p.y > 500) p.vy *= -1;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = p.color;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fill();
                });
                // Draw chains between close particles
                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dist = Math.hypot(particles[i].x - particles[j].x, particles[i].y - particles[j].y);
                        if (dist < 80) {
                            ctx.strokeStyle = `rgba(168,85,247,${1 - dist/80})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.stroke();
                        }
                    }
                }
                ctx.shadowBlur = 0;
                currentGameLoop = requestAnimationFrame(loop);
            }
            loop();
        }

        function playShadowRunner() {
            let player = { x: 250, y: 400, w: 30, h: 30, vy: 0, grounded: true };
            let obstacles = [];
            let score = 0;
            let spawnTimer = 0;

            function loop() {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                // Ground
                ctx.fillStyle = '#222';
                ctx.fillRect(0, 440, 500, 60);
                // Player shadow
                if (!player.grounded) player.vy += 0.8;
                player.y += player.vy;
                if (player.y >= 410) { player.y = 410;
                    player.vy = 0;
                    player.grounded = true; }
                if (mouse.down && player.grounded) { player.vy = -14;
                    player.grounded = false;
                    mouse.down = false; }
                // Spawn obstacles
                spawnTimer++;
                if (spawnTimer > 60) { obstacles.push({ x: 520, y: 410, w: 25, h: 30, speed: 5 + score / 20 });
                    spawnTimer = 0; }
                obstacles.forEach((o, i) => {
                    o.x -= o.speed;
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(o.x, o.y, o.w, o.h);
                    if (o.x < -30) obstacles.splice(i, 1);
                    if (o.x < player.x + player.w && o.x + o.w > player.x && o.y < player.y + player.h &&
                        o.y + o.h > player.y) {
                        score = 0;
                        obstacles = [];
                    }
                });
                if (player.y >= 410) score += 0.5;
                ctx.fillStyle = '#a855f7';
                ctx.fillRect(player.x, player.y, player.w, player.h);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 18px Segoe UI';
                ctx.fillText('Score: ' + Math.floor(score), 20, 40);
                ctx.fillText('Tap to Jump!', 340, 40);
                currentGameLoop = requestAnimationFrame(loop);
            }
            loop();
        }

        function playLaserDefense() {
            let turret = { x: 250, y: 450, angle: -Math.PI / 2 };
            let bullets = [];
            let enemies = [];
            let spawnTimer = 0;

            function loop() {
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                turret.angle = Math.atan2(mouse.y - turret.y, mouse.x - turret.x);
                if (mouse.down) { bullets.push({ x: turret.x, y: turret.y, vx: Math.cos(turret.angle) * 8, vy: Math.sin(
                        turret.angle) * 8, life: 60 });
                    mouse.down = false; }
                bullets.forEach((b, i) => { b.x += b.vx;
                    b.y += b.vy;
                    b.life--; if (b.life <= 0) bullets.splice(i, 1);
                    ctx.fillStyle = '#facc15';
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
                    ctx.fill(); });
                spawnTimer++;
                if (spawnTimer > 40) { enemies.push({ x: Math.random() * 480 + 10, y: -20, vy: 1.5 + Math.random() * 2,
                        r: 15 }); spawnTimer = 0; }
                enemies.forEach((e, i) => {
                    e.y += e.vy;
                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);

                y: 380, angle: Math.PI / 3 }];

                ctx.fillStyle = '#000';

                for (let step = 0; step < 300; step++) {
                    beam.x += beam.dx * 3;
                    beam.y += beam.dy * 3;
                    mirrors.forEach(m => { if (Math.hypot(beam.x - m.x, beam.y - m.y) < 30) { let nx = Math.cos(m
                                .angle); let ny = Math.sin(m.angle); let dot = beam.dx * nx + beam.dy * ny;
                            beam.dx -= 2 * dot * nx;
                            beam.dy -= 2 * dot * ny; } });
                    ctx.fillStyle = 'rgba(255,50,50,0.6)';
                    ctx.fillRect(beam.x, beam.y, 2, 2);
                }
                mirrors.forEach(m => { ctx.fillStyle = '#fff';

                    ctx.translate(m.x, m.y);

                ctx.fillStyle = '#22c55e';
                ctx.beginPath();
                ctx.arc(target.x, target.y, target.r, 0, Math.PI * 2);

                currentGameLoop = requestAnimationFrame(loop);

            loop();

            let pattern = [];

            let showing = true;
            let showTimer = 0;
            for (let i = 0; i < 4; i++) pattern.push(Math.floor(Math.random() * 9));
            const positions = [
                [60, 60],
                [210, 60],
                [360, 60],
                [60, 210],
                [210, 210],
                [360, 210],
                [60, 360],
                [210, 360],
                [360, 360]
            ];

            function loop() {
                ctx.fillStyle = '#000';

                    ctx.fillStyle = '#222';
                    ctx.fillRect(x, y, 120, 120);
                    ctx.strokeStyle = '#444';
                    ctx.strokeRect(x, y, 120, 120);
                });
                if (showing) {
                    showTimer++;
                    pattern.forEach(idx => { ctx.fillStyle = '#facc15';
                        ctx.fillRect(positions[idx][0], positions[idx][1], 120, 120); });
                    if (showTimer > 80) { showing = false;
                        showTimer = 0; }

                if (!showing && mouse.down) {
                    positions.forEach(([x, y], i) => { if (mouse.x > x && mouse.x < x + 120 && mouse.y > y && mouse.y < y +
                            120) { playerPattern.push(i); } });
                    mouse.down = false;
                    if (playerPattern.length === pattern.length) {
                        let correct = playerPattern.every((v, i) => v === pattern[i]);
                        ctx.fillStyle = correct ? '#22c55e' : '#ef4444';
                        ctx.fillText(correct ? 'CORRECT! 🎉' : 'WRONG! Try Again', 180, 480);
                        setTimeout(() => { pattern = [];
                            for (let i = 0; i < 4; i++) pattern.push(Math.floor(Math.random() * 9));
                            playerPattern = [];

                            showTimer = 0; }, 1500);

        // ============================================
        // 🔮 FLOATING BALL - TOUCH & GYROSCOPE PHYSICS
        // ============================================
        const ball = document.getElementById('floatingBall');
        let posX = window.innerWidth - 90,
            posY = window.innerHeight - 160;
        let vx = 0,
            vy = 0;
        const gravity = 0.5;
        const bounce = 0.65;
        const friction = 0.98;
        let isDragging = false;
        let lastMouseX = 0,
            lastMouseY = 0;
        let hasGyro = false;
        let gyroGamma = 0,
            gyroBeta = 0;

        // Gyroscope
        window.addEventListener('deviceorientation', (e) => {
            if (e.gamma !== null && e.beta !== null) {
                hasGyro = true;
                gyroGamma = e.gamma;
                gyroBeta = e.beta;
                ball.classList.remove('floating');
            }
        });

        // If no gyro, keep floating animation
        if (!hasGyro) {
            ball.classList.add('floating');
        }

        function updateBall() {
            if (!isDragging) {
                if (hasGyro) {
                    vx += gyroGamma * 0.06;
                    vy += (gyroBeta - 30) * 0.06;
                }
                vy += gravity;
                vx *= friction;
                posX += vx;
                posY += vy;

                const ballSize = ball.offsetWidth || 70;
                if (posY + ballSize > window.innerHeight) {
                    posY = window.innerHeight - ballSize;
                    vy *= -bounce;
                    vx *= 0.9;
                }
                if (posY < 0) { posY = 0;
                    vy *= -bounce; }
                if (posX + ballSize > window.innerWidth) {
                    posX = window.innerWidth - ballSize;
                    vx *= -bounce;
                }
                if (posX < 0) { posX = 0;
                    vx *= -bounce; }

                ball.style.left = posX + 'px';
                ball.style.top = posY + 'px';
            }
            requestAnimationFrame(updateBall);
        }

        function startDrag(e) {
            isDragging = true;
            ball.classList.remove('floating');
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            lastMouseX = clientX;
            lastMouseY = clientY;
            vx = 0;
            vy = 0;
            ball.style.transition = 'transform 0.05s ease-out';
        }

        function moveDrag(e) {
            if (!isDragging) return;
            e.preventDefault();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            vx = (clientX - lastMouseX) * 1.5;
            vy = (clientY - lastMouseY) * 1.5;
            const ballSize = ball.offsetWidth || 70;
            posX = Math.max(0, Math.min(window.innerWidth - ballSize, clientX - ballSize / 2));
            posY = Math.max(0, Math.min(window.innerHeight - ballSize, clientY - ballSize / 2));
            ball.style.left = posX + 'px';
            ball.style.top = posY + 'px';
            lastMouseX = clientX;
            lastMouseY = clientY;
        }

        function endDrag() {
            if (isDragging) {
                isDragging = false;
                ball.style.transition = 'transform 0.08s ease-out';
                if (!hasGyro) {
                    setTimeout(() => ball.classList.add('floating'), 1500);
                }
            }
        }

        // Mouse events
        ball.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', (e) => { if (isDragging) moveDrag(e); }, { passive: false });
        window.addEventListener('mouseup', endDrag);

        // Touch events
        ball.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', (e) => { if (isDragging) moveDrag(e); }, { passive: false });
        window.addEventListener('touchend', endDrag);

        // Prevent default touch on ball
        ball.addEventListener('touchstart', (e) => e.preventDefault());

        // Start ball physics
        updateBall();

        // Resize handler
        window.addEventListener('resize', () => {
            const ballSize = ball.offsetWidth || 70;
            posX = Math.min(posX, window.innerWidth - ballSize);
            posY = Math.min(posY, window.innerHeight - ballSize);
            ball.style.left = posX + 'px';
            ball.style.top = posY + 'px';
        });

        // ============================================
        // ⌨️ KEYBOARD SUPPORT FOR SPEED MATH
        // ============================================
        let mathInput = '';
        document.addEventListener('keydown', function(e) {
            if (document.getElementById('gameModal').style.display === 'flex') {
                if (e.key >= '0' && e.key <= '9') mathInput += e.key;
                if (e.key === 'Backspace') mathInput = mathInput.slice(0, -1);
                if (e.key === '-' && mathInput === '') mathInput = '-';
                if (e.key === 'Enter' && mathInput) {
                    mouse.down = true;
                    // Trigger the math game's mouse.down handler
                    const evt = new MouseEvent('mousedown', { clientX: 250, clientY: 400 });
                    canvas.dispatchEvent(evt);
                }
            }
        });

        console.log('✅ Game Outway Loaded Successfully!');
