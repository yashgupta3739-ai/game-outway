    /* 🔮 FLOATING PURPLE BALL (80px x 80px) */

  <script>
    // 🎮 WORKING EMBED PLAYER
    function playGame(url) {
      const modal = document.getElementById('gameModal');
      const frame = document.getElementById('gameFrame');
      frame.src = url;
      modal.style.display = 'flex';
    }

    function closeGame() {
      const modal = document.getElementById('gameModal');
      const frame = document.getElementById('gameFrame');
      frame.src = "";
      modal.style.display = 'none';
    }

    function selectCategory(cat) {
      const buttons = document.querySelectorAll('.category-btn');
      buttons.forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      const sections = document.querySelectorAll('.game-category');
      sections.forEach(sec => {
        if (cat === 'all' || sec.getAttribute('data-category') === cat) {
          sec.style.display = 'block';
        } else {
          sec.style.display = 'none';
        }
      });
    }

    function filterGames() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.game-card');
      cards.forEach(card => {
        const title = card.querySelector('h3').innerText.toLowerCase();
        card.style.display = title.includes(query) ? 'block' : 'none';
      });
    }

    // 🔮 FLOATING PURPLE BALL PHYSICS (80px)
    const ball = document.getElementById('floatingBall');
    let posX = window.innerWidth - 100;
    let posY = window.innerHeight - 150;
    let vx = 0, vy = 0, gravity = 0.6, bounce = 0.7;
    let isDragging = false, lastMouseX = 0, lastMouseY = 0;

    function updateBall() {
      if (!isDragging) {
        vy += gravity; posX += vx; posY += vy;
        if (posY + 80 > window.innerHeight) { posY = window.innerHeight - 80; vy *= -bounce; vx *= 0.95; }
        if (posY < 0) { posY = 0; vy *= -bounce; }
        if (posX + 80 > window.innerWidth) { posX = window.innerWidth - 80; vx *= -bounce; }
        if (posX < 0) { posX = 0; vx *= -bounce; }
        ball.style.left = posX + 'px'; ball.style.top = posY + 'px';
      }
      requestAnimationFrame(updateBall);
    }

    function startDrag(e) {
      isDragging = true;
      lastMouseX = e.touches ? e.touches[0].clientX : e.clientX;
      lastMouseY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = 0; vy = 0;
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = clientX - lastMouseX; vy = clientY - lastMouseY;
      posX = clientX - 40; posY = clientY - 40;
      ball.style.left = posX + 'px'; ball.style.top = posY + 'px';
      lastMouseX = clientX; lastMouseY = clientY;
    }

    function endDrag() { isDragging = false; }

    ball.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', moveDrag, { passive: false });
    window.addEventListener('mouseup', endDrag);
    ball.addEventListener('touchstart', startDrag, { passive: false });
    window.addEventListener('touchmove', moveDrag, { passive: false });
    window.addEventListener('touchend', endDrag);
    updateBall();
  </script>
