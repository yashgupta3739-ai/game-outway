<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Outway - Free Online Games</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="header-container">
            <div class="logo">🎮 <span>Game Outway</span></div>
            
            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="searchInput" onkeyup="searchGames()" placeholder="🔍 Search games...">
            </div>
        </div>

        <!-- Category Filter Buttons -->
        <div class="category-bar">
            <button class="cat-btn active" onclick="filterCategory('all')">🔥 All Games</button>
            <button class="cat-btn" onclick="filterCategory('racing')">🏎️ Racing</button>
            <button class="cat-btn" onclick="filterCategory('puzzle')">🧩 Puzzle</button>
            <button class="cat-btn" onclick="filterCategory('action')">🎯 Action</button>
        </div>
    </header>

    <!-- Main Game Section (Full Screen Grid) -->
    <main class="main-layout">
        <h2 class="section-title">⚡ Featured Games</h2>
        
        <div class="game-grid" id="gameGrid">
            
            <!-- Game 1: Moto X3M -->
            <div class="game-card" data-category="racing" onclick="playGame('https://html5.gamedistribution.com/rvvAS300/a18b76c5b967484398103c8346e49e29/index.html', 'Moto X3M Bike Race')">
                <div class="thumb-box">
                    <img src="https://img.gamedistribution.com/a18b76c5b967484398103c8346e49e29-512x512.jpeg" alt="Moto X3M">
                </div>
                <div class="card-info">
                    <h3>Moto X3M Bike</h3>
                    <span class="tag racing">Racing</span>
                </div>
            </div>

            <!-- Game 2: Tic Tac Toe -->
            <div class="game-card" data-category="puzzle" onclick="playGame('https://html5.gamedistribution.com/131c905b63014a48a04df596397394d2/', 'Tic Tac Toe Master')">
                <div class="thumb-box">
                    <img src="https://img.gamedistribution.com/131c905b63014a48a04df596397394d2-512x512.jpeg" alt="Tic Tac Toe">
                </div>
                <div class="card-info">
                    <h3>Tic Tac Toe</h3>
                    <span class="tag puzzle">Puzzle</span>
                </div>
            </div>

            <!-- Game 3: Classic Car Parking -->
            <div class="game-card" data-category="action" onclick="playGame('https://html5.gamedistribution.com/3c81216b23d944c6883f3e12591e1273/', 'Classic Car Parking')">
                <div class="thumb-box">
                    <img src="https://img.gamedistribution.com/3c81216b23d944c6883f3e12591e1273-512x512.jpeg" alt="Car Parking">
                </div>
                <div class="card-info">
                    <h3>Car Parking</h3>
                    <span class="tag action">Action</span>
                </div>
            </div>

            <!-- Game 4: Drift Boss -->
            <div class="game-card" data-category="racing" onclick="playGame('https://html5.gamedistribution.com/a712217f2fa84d128dc66be4e3ca8e20/', 'Drift Boss')">
                <div class="thumb-box">
                    <img src="https://img.gamedistribution.com/a712217f2fa84d128dc66be4e3ca8e20-512x512.jpeg" alt="Drift Boss">
                </div>
                <div class="card-info">
                    <h3>Drift Boss</h3>
                    <span class="tag racing">Racing</span>
                </div>
            </div>

            <!-- Game 5: Penalty Kick -->
            <div class="game-card" data-category="action" onclick="playGame('https://html5.gamedistribution.com/530263be7d2d46e3a6a964a2786a6552/', 'Penalty Kick')">
                <div class="thumb-box">
                    <img src="https://img.gamedistribution.com/530263be7d2d46e3a6a964a2786a6552-512x512.jpeg" alt="Penalty Kick">
                </div>
                <div class="card-info">
                    <h3>Penalty Kick</h3>
                    <span class="tag action">Action</span>
                </div>
            </div>

        </div>
    </main>

    <!-- Game Player Modal Popup -->
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalGameTitle">Playing Game</h2>
                <button class="close-btn" onclick="closeGame()">❌ Close Game</button>
            </div>
            <iframe id="gameFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 <strong>Game Outway</strong>. All Rights Reserved.</p>
    </footer>

    <!-- Interactive Script -->
    <script>
        function playGame(gameUrl, title) {
            document.getElementById('modalGameTitle').innerText = title;
            document.getElementById('gameFrame').src = gameUrl;
            document.getElementById('gameModal').style.display = "flex";
        }

        function closeGame() {
            document.getElementById('gameModal').style.display = "none";
            document.getElementById('gameFrame').src = "";
        }

        function searchGames() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let cards = document.getElementsByClassName('game-card');

            for (let i = 0; i < cards.length; i++) {
                let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
                cards[i].style.display = title.includes(input) ? "flex" : "none";
            }
        }

        function filterCategory(category) {
            let cards = document.getElementsByClassName('game-card');
            let buttons = document.getElementsByClassName('cat-btn');

            for (let btn of buttons) btn.classList.remove('active');
            event.target.classList.add('active');

            for (let card of cards) {
                if (category === 'all' || card.getAttribute('data-category') === category) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            }
        }
    </script>

</body>
</html>
