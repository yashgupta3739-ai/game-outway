<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 GameOutway - 250+ Premium HTML5 Games</title>

    <!-- ======== STYLES ======== -->
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg: #0b0e14;
            --bg2: #141a24;
            --card: #1e2633;
            --card-hover: #2a3445;
            --text: #f0f4fa;
            --text-dim: #8a9bb5;
            --accent: #6c8cff;
            --accent-glow: rgba(108, 140, 255, 0.25);
            --border: #2a3445;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --radius: 14px;
            --transition: 0.25s ease;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 0 20px 60px;
            transition: background 0.3s, color 0.3s;
        }

        /* --- LIGHT THEME --- */
        body.light {
            --bg: #f4f7fc;
            --bg2: #e8edf5;
            --card: #ffffff;
            --card-hover: #f0f4ff;
            --text: #111827;
            --text-dim: #4b5a74;
            --border: #dce3ed;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        /* ----- SCROLLBAR ----- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg2);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 8px;
        }

        /* ----- HEADER ----- */
        .header {
            max-width: 1400px;
            margin: 0 auto 24px;
            padding: 20px 0 12px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-area .ball {
            width: 44px;
            height: 44px;
            background: radial-gradient(circle at 35% 35%, #ffcc66, #e68a00);
            border-radius: 50%;
            box-shadow: 0 0 24px rgba(255, 200, 50, 0.35), inset 0 -4px 8px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
            transition: transform 0.3s;
            cursor: default;
        }
        .logo-area .ball:hover {
            transform: scale(1.08) rotate(-8deg);
        }

        .logo-area h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-area h1 span {
            font-weight: 300;
            -webkit-text-fill-color: var(--text-dim);
        }
        body.light .logo-area h1 {
            background: linear-gradient(135deg, #111827 30%, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .theme-toggle {
            background: var(--bg2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-toggle:hover {
            background: var(--card-hover);
            border-color: var(--accent);
        }

        .game-count-badge {
            background: var(--accent);
            color: #fff;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        /* ----- SEARCH & FILTERS ----- */
        .controls {
            max-width: 1400px;
            margin: 0 auto 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px 18px;
        }

        .search-box {
            flex: 1 1 260px;
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 11px 20px 11px 44px;
            border-radius: 40px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }
        .search-box input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .search-box .icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
            font-size: 18px;
            pointer-events: none;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .filter-btn {
            padding: 8px 18px;
            border-radius: 30px;
            border: 1px solid var(--border);
            background: var(--bg2);
            color: var(--text-dim);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }
        .filter-btn:hover {
            background: var(--card-hover);
            color: var(--text);
        }
        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ----- GAME GRID ----- */
        .games-grid {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 18px;
        }

        /* --- GAME CARD --- */
        .game-card {
            background: var(--card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.25s, border-color 0.25s;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-5px) scale(1.01);
            box-shadow: var(--shadow);
            border-color: var(--accent);
        }

        .thumb-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: var(--bg2);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .thumb-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
            display: block;
        }
        .game-card:hover .thumb-wrapper img {
            transform: scale(1.03);
        }

        .card-info {
            padding: 10px 12px 12px;
        }
        .card-info h3 {
            font-size: 14px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .category-tag {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-dim);
            background: var(--bg2);
            padding: 2px 12px;
            border-radius: 30px;
            display: inline-block;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        body.light .category-tag {
            background: #eef3fa;
        }

        /* empty state */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-dim);
            font-size: 18px;
        }

        /* ----- IFRAME CONTAINER (game player) ----- */
        .player-section {
            max-width: 1400px;
            margin: 24px auto 0;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            display: none;
            /* shown when game is loaded */;
        }
        .player-section.active {
            display: block;
        }

        .player-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .player-header .game-title {
            font-weight: 600;
            font-size: 17px;
        }
        .player-header .close-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 22px;
            cursor: pointer;
            padding: 0 6px;
            transition: var(--transition);
            line-height: 1;
        }
        .player-header .close-btn:hover {
            color: #ff6b6b;
            transform: scale(1.15);
        }

        .player-iframe-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            /* 16:9 */
            background: #000;
        }
        .player-iframe-wrap iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: #0b0e14;
        }

        /* ----- ADS (keep as-is) ----- */
        .ad-container {
            max-width: 1400px;
            margin: 18px auto 0;
            padding: 10px;
            background: var(--bg2);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            text-align: center;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-dim);
            font-size: 13px;
        }
        .ad-container img,
        .ad-container iframe {
            max-width: 100%;
            border-radius: 6px;
        }

        /* ----- RESPONSIVE ----- */
        @media (max-width: 700px) {
            .header {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .logo-area h1 {
                font-size: 20px;
            }
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                justify-content: center;
            }
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 12px;
            }
            .card-info h3 {
                font-size: 12px;
            }
            .player-header .game-title {
                font-size: 14px;
            }
        }

        @media (max-width: 450px) {
            .games-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }
            .card-info {
                padding: 6px 8px 8px;
            }
            .card-info h3 {
                font-size: 11px;
            }
            .category-tag {
                font-size: 9px;
                padding: 1px 8px;
            }
        }

        /* ----- BALL (keep) ----- */
        .ball-float {
            position: fixed;
            bottom: 24px;
            right: 24px;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #ffdd77, #d48900);
            box-shadow: 0 0 40px rgba(255, 200, 50, 0.3), inset 0 -6px 12px rgba(0, 0, 0, 0.35);
            z-index: 999;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            user-select: none;
            animation: pulse-ball 2.5s infinite ease-in-out;
        }
        .ball-float:hover {
            transform: scale(1.1);
            box-shadow: 0 0 60px rgba(255, 200, 50, 0.5);
        }
        @keyframes pulse-ball {
            0%,
            100% {
                box-shadow: 0 0 30px rgba(255, 200, 50, 0.25);
            }
            50% {
                box-shadow: 0 0 60px rgba(255, 200, 50, 0.45);
            }
        }

        /* scroll to top hint */
        .footer-note {
            max-width: 1400px;
            margin: 30px auto 0;
            text-align: center;
            color: var(--text-dim);
            font-size: 13px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .footer-note strong {
            color: var(--accent);
        }
    </style>
</head>

            { id: 'a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1', title: 'Stickman Baseball', cat: 'sports' },
            { id: 'b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1', title: 'Table Football', cat: 'sports' },
            { id: 'c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1', title: 'Air Hockey', cat: 'sports' },
            { id: 'd6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1', title: 'Mini Golf', cat: 'sports' },
            { id: 'e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1', title: 'Skee Ball', cat: 'sports' },

            { id: 'f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1', title: 'Bomb Runner', cat: 'action' },
            { id: 'a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2', title: 'Gun Runner', cat: 'action' },
            { id: 'b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2', title: 'Stickman War', cat: 'action' },
            { id: 'c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2', title: 'Ninja Dash', cat: 'action' },
            { id: 'd7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2', title: 'Shadow Blade', cat: 'action' },

            { id: 'e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2', title: 'Bike Stunt', cat: 'racing' },
            { id: 'f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2', title: 'Road Race', cat: 'racing' },
            { id: 'a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3', title: 'Rally 3D', cat: 'racing' },
            { id: 'b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3', title: 'Street Race', cat: 'racing' },
            { id: 'c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3', title: 'Night Racer', cat: 'racing' },

            { id: 'd8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3', title: 'Match 3 Adventure', cat: 'puzzle' },
            { id: 'e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3', title: 'Zuma Deluxe', cat: 'puzzle' },
            { id: 'f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3', title: 'Bejeweled', cat: 'puzzle' },

            { id: 'a9b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4', title: 'Fruit Slice', cat: 'arcade' },
            { id: 'b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4', title: 'Candy Crush 2', cat: 'arcade' },
            { id: 'c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4', title: 'Jelly Splash', cat: 'arcade' },
            { id: 'd9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4', title: 'Bubble Witch', cat: 'arcade' },
        ];

        // ---- manually add Retro Bowl (custom URL) ----
        // We'll handle it in the load function

        // ================================================================
        //  2.  STATE
        // ================================================================
        let currentFilter = 'all';
        let searchQuery = '';
        let currentGame = null;

        // ================================================================
        //  3.  DOM REFS
        // ================================================================
        const grid = document.getElementById('gamesGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const playerSection = document.getElementById('playerSection');
        const gameIframe = document.getElementById('gameIframe');
        const playerTitle = document.getElementById('playerTitle');
        const closePlayer = document.getElementById('closePlayer');
        const gameCountBadge = document.getElementById('gameCountBadge');
        const themeToggle = document.getElementById('themeToggle');
        const floatingBall = document.getElementById('floatingBall');

        // ================================================================
        //  4.  HELPERS
        // ================================================================
        function getGameUrl(game) {
            if (game.custom && game.id === '316-github-io-retro-bowl') {
                return 'https://game316.github.io/retro-bowl/';
            }
            return `https://html5.gamedistribution.com/${game.id}/`;
        }

        function getImageUrl(game) {
            if (game.custom && game.id === '316-github-io-retro-bowl') {
                return 'https://tse1.mm.bing.net/th?q=Retro+Bowl+game+icon&w=300&h=300&c=7&rs=1';
            }
            return `https://images.gamedistribution.com/${game.id}-512x512.jpeg`;
        }

        function getCategoryLabel(cat) {
            const map = {
                action: 'Action',
                racing: 'Racing',
                puzzle: 'Puzzle',
                sports: 'Sports',
                trending: '🔥 Trending',
                arcade: 'Arcade',
                strategy: 'Strategy'
            };
            return map[cat] || cat;
        }

        // ================================================================
        //  5.  RENDER
        // ================================================================
        function renderGames() {
            const filtered = GAME_DB.filter(game => {
                const matchCat = currentFilter === 'all' || game.cat === currentFilter;
                const matchSearch = game.title.toLowerCase().includes(searchQuery.toLowerCase());
                return matchCat && matchSearch;
            });

            // update badge
            gameCountBadge.textContent = filtered.length;

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="no-results">😕 No games found. Try a different filter or search.</div>`;
                return;
            }

            let html = '';
            for (const game of filtered) {
                const img = getImageUrl(game);
                const catLabel = getCategoryLabel(game.cat);
                html += `
                    <div class="game-card" data-cat="${game.cat}" onclick="loadGame('${game.id}')">
                        <div class="thumb-wrapper">
                            <img src="${img}" alt="${game.title}" loading="lazy" onerror="this.src='https://via.placeholder.com/300x300/1e2633/8a9bb5?text=${encodeURIComponent(game.title)}'" />
                        </div>
                        <div class="card-info">
                            <h3>${game.title}</h3>
                            <span class="category-tag">${catLabel}</span>
                        </div>
                    </div>
                `;
            }
            grid.innerHTML = html;
        }

        // ================================================================
        //  6.  LOAD GAME
        // ================================================================
        window.loadGame = function(gameId) {
            const game = GAME_DB.find(g => g.id === gameId);
            if (!game) return;

            currentGame = game;
            const url = getGameUrl(game);
            gameIframe.src = url;
            playerTitle.textContent = game.title;
            playerSection.classList.add('active');

            // scroll to player
            playerSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        // close player
        closePlayer.addEventListener('click', function() {
            playerSection.classList.remove('active');
            gameIframe.src = '';
            currentGame = null;
        });

        // ================================================================
        //  7.  FILTERS & SEARCH
        // ================================================================
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.cat;
                renderGames();
            });
        });

        searchInput.addEventListener('input', function() {
            searchQuery = this.value;
            renderGames();
        });

        // ================================================================
        //  8.  THEME TOGGLE
        // ================================================================
        themeToggle.addEventListener('click', function() {
            document.body.classList.toggle('light');
            const isLight = document.body.classList.contains('light');
            this.textContent = isLight ? '☀️ Light' : '🌙 Dark';
        });

        // ================================================================
        //  9.  FLOATING BALL (keep)
        // ================================================================
        floatingBall.addEventListener('click', function() {
            // scroll to top with a fun bounce
            window.scrollTo({ top: 0, behavior: 'smooth' });
            this.style.transform = 'scale(1.3) rotate(20deg)';
            setTimeout(() => { this.style.transform = ''; }, 400);
        });

        // ================================================================
        //  10. INIT
        // ================================================================
        renderGames();

        // log count
        console.log(`🎮 GameOutway loaded with ${GAME_DB.length} games.`);
    </script>

</body>
