    function renderGames(filterList) {
      const grid = document.getElementById('gamesGrid');
      grid.innerHTML = '';

      if (filterList.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 40px;">No games found matching your search.</div>`;
        return;
      }

      filterList.forEach(game => {
        const card = document.createElement('div');
        card.className = 'game-card';
        card.onclick = () => playGame(game.name, game.url);
        card.innerHTML = `
          <img class="game-thumb" src="${game.img}" alt="${game.name}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackImage}';">
          <div class="game-info">
            <div class="game-title">${game.name}</div>
            <div class="game-tag">${game.cat.toUpperCase()} GAME</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function playGame(title, url) {
      document.getElementById('activeGameTitle').innerText = title;
      document.getElementById('gameFrame').src = url;

        const matchesCat = currentCategory === 'all' || g.cat === currentCategory;
        const matchesQuery = g.name.toLowerCase().includes(query) || g.cat.toLowerCase().includes(query);
        return matchesCat && matchesQuery;
      });
      renderGames(filtered);
    }
