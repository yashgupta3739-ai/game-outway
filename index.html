    // ============================================
    // FLOATING BALL - TOUCH DRAG ONLY (NO GYRO)
    // ============================================
    const ball = document.getElementById('floatingBall');
    let posX = window.innerWidth - 90, posY = window.innerHeight - 160;
    let vx = 0, vy = 0;
    const gravity = 0.5, bounce = 0.65, friction = 0.98;
    let isDragging = false, lastMouseX=0, lastMouseY=0;

    function updateBall() {
      if (!isDragging) {
        vy += gravity;
        vx *= friction;
        posX += vx;
        posY += vy;
        const ballSize = ball.offsetWidth || 70;
        if (posY + ballSize > window.innerHeight) { posY = window.innerHeight - ballSize; vy *= -bounce; vx *= 0.9; }
        if (posY < 0) { posY = 0; vy *= -bounce; }
        if (posX + ballSize > window.innerWidth) { posX = window.innerWidth - ballSize; vx *= -bounce; }
        if (posX < 0) { posX = 0; vx *= -bounce; }
        ball.style.left = posX + 'px';
        ball.style.top = posY + 'px';
      }
      requestAnimationFrame(updateBall);
    }

    function startDrag(e) {
      isDragging = true;
      ball.style.animation = 'none';
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      lastMouseX = clientX; lastMouseY = clientY;
      vx = 0; vy = 0;
    }

    function moveDrag(e) {
      if (!isDragging) return;
      e.preventDefault();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      vx = (clientX - lastMouseX) * 1.5;
      vy = (clientY - lastMouseY) * 1.5;
      const ballSize = ball.offsetWidth || 70;
      posX = Math.max(0, Math.min(window.innerWidth - ballSize, clientX - ballSize/2));
      posY = Math.max(0, Math.min(window.innerHeight - ballSize, clientY - ballSize/2));
      ball.style.left = posX + 'px';
      ball.style.top = posY + 'px';
      lastMouseX = clientX; lastMouseY = clientY;
    }

    function endDrag() {
      if (isDragging) {
        isDragging = false;
        ball.style.animation = 'floatBall 3s ease-in-out infinite';
      }
    }

    ball.addEventListener('mousedown', startDrag);
    window.addEventListener('mousemove', (e)=>{ if(isDragging) moveDrag(e); }, {passive:false});
    window.addEventListener('mouseup', endDrag);
    ball.addEventListener('touchstart', startDrag, {passive:false});
    window.addEventListener('touchmove', (e)=>{ if(isDragging) moveDrag(e); }, {passive:false});
    window.addEventListener('touchend', endDrag);
    ball.addEventListener('touchstart', (e)=>e.preventDefault());
    updateBall();

    window.addEventListener('resize', ()=>{
      const ballSize = ball.offsetWidth || 70;
      posX = Math.min(posX, window.innerWidth - ballSize);
      posY = Math.min(posY, window.innerHeight - ballSize);
    });
